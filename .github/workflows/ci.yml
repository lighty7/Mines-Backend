name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mines
          POSTGRES_PASSWORD: mines
          POSTGRES_DB: mines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mines:mines@localhost:5432/mines
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-thirty-two-characters
      BCRYPT_ROUNDS: "10"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test